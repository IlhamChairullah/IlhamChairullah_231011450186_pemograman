<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Modern</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        background:#f1f1f1;
        transition:0.3s;
    }

    body.dark{
        background:#1e1e1e;
    }

    .calculator{
        width:320px;
        background:white;
        padding:20px;
        border-radius:20px;
        box-shadow:0 5px 15px rgba(0,0,0,0.2);
        transition:0.3s;
    }

    .title{
    text-align:center;
    margin-bottom:10px;
}

.identitas{
    text-align:center;
    margin-bottom:15px;
    font-size:14px;
}
    
    body.dark .calculator{
        background:#2d2d2d;
        color:white;
    }

    .display{
        width:100%;
        height:70px;
        margin-bottom:15px;
        border:none;
        border-radius:10px;
        text-align:right;
        padding:10px;
        font-size:28px;
        background:#e9e9e9;
    }

    body.dark .display{
        background:#444;
        color:white;
    }

    .buttons{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:10px;
    }

    button{
        padding:18px;
        font-size:20px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        transition:0.2s;
    }

    button:hover{
        transform:scale(1.05);
    }

    .number{
        background:#dcdcdc;
    }

    .operator{
        background:orange;
        color:white;
    }

    .equal{
        background:#28a745;
        color:white;
    }

    .clear{
        background:red;
        color:white;
    }

    .toggle{
        width:100%;
        margin-bottom:15px;
        background:#007bff;
        color:white;
    }

    @media(max-width:400px){
        .calculator{
            width:95%;
        }

        button{
            padding:15px;
            font-size:18px;
        }
    }
</style>
</head>

<body>

<div class="calculator">

    <h2 class="title">Kalkulator Modern</h2>

    <p class="identitas">
        Nama : Ilham Chairullah <br>
        NIM : 231011450186
    </p>

    <button class="toggle" onclick="toggleMode()">
        Light / Dark Mode
    </button>

    <input type="text" id="display" class="display" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendValue('/')">/</button>
        <button class="operator" onclick="appendValue('*')">*</button>
        <button class="operator" onclick="deleteLast()">⌫</button>

        <button class="number" onclick="appendValue('7')">7</button>
        <button class="number" onclick="appendValue('8')">8</button>
        <button class="number" onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">-</button>

        <button class="number" onclick="appendValue('4')">4</button>
        <button class="number" onclick="appendValue('5')">5</button>
        <button class="number" onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="number" onclick="appendValue('1')">1</button>
        <button class="number" onclick="appendValue('2')">2</button>
        <button class="number" onclick="appendValue('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>

        <button class="number" onclick="appendValue('0')">0</button>
        <button class="number" onclick="appendValue('.')">.</button>

    </div>

</div>

<script>

    const display = document.getElementById("display");

    function appendValue(value){

        // Validasi agar hanya angka dan operator valid
        const allowed = "0123456789+-*/.";

        if(allowed.includes(value)){
            display.value += value;
        }
    }

    function clearDisplay(){
        display.value = "";
    }

    function deleteLast(){
        display.value = display.value.slice(0,-1);
    }

    function calculate(){

        // Validasi input kosong
        if(display.value === ""){
            alert("Input tidak boleh kosong!");
            return;
        }

        try{
            display.value = eval(display.value);
        }
        catch{
            alert("Input tidak valid!");
        }
    }

    function toggleMode(){
        document.body.classList.toggle("dark");
    }

</script>

</body>
</html>
