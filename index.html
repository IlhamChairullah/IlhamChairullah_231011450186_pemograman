<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalkulator Modern</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#141e30,#243b55);
    transition:0.4s;
}

body.dark{
    background:linear-gradient(135deg,#000000,#434343);
}

.calculator{
    width:360px;
    padding:25px;
    border-radius:25px;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    transition:0.4s;
}

.title{
    text-align:center;
    color:white;
    margin-bottom:8px;
    font-size:28px;
    letter-spacing:1px;
}

.identitas{
    text-align:center;
    color:#dcdcdc;
    margin-bottom:20px;
    font-size:14px;
    line-height:22px;
}

.display{
    width:100%;
    height:80px;
    border:none;
    outline:none;
    border-radius:15px;
    margin-bottom:20px;
    padding:15px;
    font-size:32px;
    text-align:right;
    background:rgba(255,255,255,0.15);
    color:white;
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.2);
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:65px;
    border:none;
    border-radius:15px;
    font-size:22px;
    cursor:pointer;
    transition:0.2s;
    font-weight:bold;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 5px 10px rgba(0,0,0,0.3);
}

.number{
    background:rgba(255,255,255,0.15);
    color:white;
}

.operator{
    background:#ff9500;
    color:white;
}

.equal{
    background:#00c853;
    color:white;
    grid-column:span 2;
}

.clear{
    background:#ff1744;
    color:white;
}

.delete{
    background:#2979ff;
    color:white;
}

.toggle{
    width:100%;
    height:50px;
    margin-bottom:15px;
    background:#7c4dff;
    color:white;
    font-size:16px;
}

.footer{
    text-align:center;
    color:#cfcfcf;
    margin-top:18px;
    font-size:12px;
}

@media(max-width:400px){

    .calculator{
        width:95%;
    }

    button{
        height:58px;
        font-size:18px;
    }

}

</style>
</head>

<body>

<div class="calculator">

    <h2 class="title">Kalkulator Modern</h2>

    <p class="identitas">
        Nama : Ilham Chairullah <br>
        NIM : 231011450186 <br>
        Mata Kuliah : Pemrograman Web I
    </p>

    <button class="toggle" onclick="toggleMode()">
        🌙 Light / Dark Mode
    </button>

    <input type="text" id="display" class="display" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>

        <button class="operator" onclick="appendValue('/')">÷</button>

        <button class="operator" onclick="appendValue('%')">%</button>

        <button class="delete" onclick="deleteLast()">⌫</button>

        <button class="number" onclick="appendValue('7')">7</button>

        <button class="number" onclick="appendValue('8')">8</button>

        <button class="number" onclick="appendValue('9')">9</button>

        <button class="operator" onclick="appendValue('*')">×</button>

        <button class="number" onclick="appendValue('4')">4</button>

        <button class="number" onclick="appendValue('5')">5</button>

        <button class="number" onclick="appendValue('6')">6</button>

        <button class="operator" onclick="appendValue('-')">−</button>

        <button class="number" onclick="appendValue('1')">1</button>

        <button class="number" onclick="appendValue('2')">2</button>

        <button class="number" onclick="appendValue('3')">3</button>

        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="number" onclick="appendValue('0')">0</button>

        <button class="number" onclick="appendValue('.')">.</button>

        <button class="equal" onclick="calculate()">=</button>

    </div>

    <p class="footer">
        UTS Pemrograman Web 1
    </p>

</div>

<script>

const display = document.getElementById("display");

function appendValue(value){

    const allowed = "0123456789+-*/%.";

    if(allowed.includes(value)){
        display.value += value;
    }

}

function clearDisplay(){
    display.value = "";
}

function deleteLast(){
    display.value = display.value.slice(0,-1);
}

function calculate(){

    if(display.value === ""){
        alert("Input tidak boleh kosong!");
        return;
    }

    try{

        let expression = display.value.replace(/%/g,"/100");

        display.value = eval(expression);

    }
    catch{
        alert("Input tidak valid!");
    }

}

function toggleMode(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
