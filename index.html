<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalkulator Minimalis</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f5f7fa;
    transition:0.3s;
}

/* MODE MALAM */
body.dark{
    background:#0f172a;
}

.calculator{
    width:340px;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    transition:0.3s;
}

/* CALCULATOR MODE MALAM */
body.dark .calculator{
    background:#1e293b;
}

.title{
    text-align:center;
    margin-bottom:8px;
    color:#2d3436;
    font-size:26px;
    font-weight:600;
}

/* TITLE MODE MALAM */
body.dark .title{
    color:white;
}

.identitas{
    text-align:center;
    margin-bottom:18px;
    color:#636e72;
    font-size:14px;
    line-height:22px;
}

/* IDENTITAS MODE MALAM */
body.dark .identitas{
    color:#cbd5e1;
}

.toggle{
    width:100%;
    height:45px;
    border:none;
    border-radius:12px;
    background:#2d3436;
    color:white;
    cursor:pointer;
    margin-bottom:18px;
    font-size:15px;
}

/* BUTTON TOGGLE MODE MALAM */
body.dark .toggle{
    background:#111827;
}

.display{
    width:100%;
    height:75px;
    border:none;
    outline:none;
    border-radius:15px;
    margin-bottom:18px;
    padding:15px;
    text-align:right;
    font-size:32px;
    background:#f1f2f6;
    color:#2d3436;
}

/* DISPLAY MODE MALAM */
body.dark .display{
    background:#334155;
    color:white;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:60px;
    border:none;
    border-radius:15px;
    font-size:20px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.03);
}

.number{
    background:#ecf0f1;
    color:#2d3436;
}

/* ANGKA MODE MALAM */
body.dark .number{
    background:#475569;
    color:white;
}

.operator{
    background:#74b9ff;
    color:white;
}

.clear{
    background:#ff7675;
    color:white;
}

.delete{
    background:#a29bfe;
    color:white;
}

.equal{
    background:#55efc4;
    color:#2d3436;
    grid-column:span 2;
    font-weight:bold;
}

.footer{
    text-align:center;
    margin-top:15px;
    font-size:12px;
    color:#636e72;
}

/* FOOTER MODE MALAM */
body.dark .footer{
    color:#cbd5e1;
}

@media(max-width:400px){

    .calculator{
        width:95%;
    }

    button{
        height:55px;
        font-size:18px;
    }

}

</style>
</head>

<body>

<div class="calculator">

    <h2 class="title">Kalkulator</h2>

    <p class="identitas">
        Nama : Ilham Chairullah <br>
        NIM : 231011450186 <br>
        Mata Kuliah : Pemograman Web I
    </p>

    <button class="toggle" onclick="toggleMode()">
        🌙 Mode Malam
    </button>

    <input type="text" id="display" class="display" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>

        <button class="operator" onclick="appendValue('/')">÷</button>

        <button class="operator" onclick="appendValue('%')">%</button>

        <button class="delete" onclick="deleteLast()">⌫</button>

        <button class="number" onclick="appendValue('7')">7</button>

        <button class="number" onclick="appendValue('8')">8</button>

        <button class="number" onclick="appendValue('9')">9</button>

        <button class="operator" onclick="appendValue('*')">×</button>

        <button class="number" onclick="appendValue('4')">4</button>

        <button class="number" onclick="appendValue('5')">5</button>

        <button class="number" onclick="appendValue('6')">6</button>

        <button class="operator" onclick="appendValue('-')">−</button>

        <button class="number" onclick="appendValue('1')">1</button>

        <button class="number" onclick="appendValue('2')">2</button>

        <button class="number" onclick="appendValue('3')">3</button>

        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="number" onclick="appendValue('0')">0</button>

        <button class="number" onclick="appendValue('.')">.</button>

        <button class="equal" onclick="calculate()">=</button>

    </div>

    <p class="footer">
        UTS Pemrograman Web 1
    </p>

</div>

<script>

const display = document.getElementById("display");

function appendValue(value){

    const allowed = "0123456789+-*/%.";

    if(allowed.includes(value)){
        display.value += value;
    }

}

function clearDisplay(){
    display.value = "";
}

function deleteLast(){
    display.value = display.value.slice(0,-1);
}

function calculate(){

    if(display.value === ""){
        alert("Input tidak boleh kosong!");
        return;
    }

    try{

        let expression = display.value.replace(/%/g,"/100");

        display.value = eval(expression);

    }
    catch{
        alert("Input tidak valid!");
    }

}

function toggleMode(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
